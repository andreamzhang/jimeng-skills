<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · __DRAMA__ · 工作台</title>
<style>
:root{
  --bg:#141414; --bg-2:#1c1c1c; --surface:#1c1c1c; --surface-2:#242424; --surface-3:#2e2e2e;
  --ink:#f2f2f2; --ink-2:#9a9a9a; --ink-3:#8a8a8a;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --gold:#e5484d; --gold-2:#ff7376; --gold-soft:rgba(229,72,77,.16); --gold-line:rgba(229,72,77,.55);
  --mark:rgba(229,72,77,.3); --topbar-h:58px; --r:14px;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.78 system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 18px;
  height:var(--topbar-h);background:var(--bg-2);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;
  background:linear-gradient(150deg,var(--gold),#8a6408)}
.topbar h1{margin:0;font-size:15px;font-weight:700}
.topbar .sub{margin:0;font-size:11.5px;color:var(--ink-3)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.hits{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
input[type=search]{width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px;outline:0}
input[type=search]:focus{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
.main{max-width:1180px;margin:0 auto;padding:16px 18px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);
  margin-bottom:14px}
.chead{position:sticky;top:var(--topbar-h);z-index:5;display:flex;justify-content:space-between;gap:12px;
  align-items:center;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 18px;border-radius:var(--r) var(--r) 0 0;backdrop-filter:blur(8px)}
.chead h2{margin:0;font-size:16px;font-weight:700}
.btn{cursor:pointer;border:1px solid rgba(66,42,22,.26);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;transition:.15s}
.btn:hover{background:var(--surface-2);border-color:var(--gold-line);color:var(--ink)}
.btn.primary{background:var(--gold-2);border-color:var(--gold-2);color:#fff;font-weight:600}
.btn.primary:hover{background:#5c4104;border-color:#5c4104;color:#fff}
.cbody{padding:4px 18px 14px}
.frow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:9px 6px;
  border-bottom:1px solid var(--line);align-items:start}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--surface-2)}
.fk{font-size:13px;font-weight:700;color:var(--gold-2);padding-top:2px}
.fv{min-width:0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.8}
.miniactions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.rest{margin-top:8px;color:var(--ink-2);font-size:13.5px}
.rest ul{margin:6px 0 6px 18px;padding:0}
.empty{margin:40px auto;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:40;background:var(--ink);
  color:var(--bg);padding:9px 16px;border-radius:22px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.2s}
.toast.on{opacity:.96;transform:translate(-50%,0)}
mark{background:var(--mark);border-radius:3px;padding:0 2px}
@media print{.topbar,.btn{display:none!important}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header class="topbar">
  <span class="logo">分</span>
  <div>
    <h1>__TITLE__</h1>
    <p class="sub">__DRAMA__ · 源文件 __SOURCE__</p>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索：母镜头 / 台词 / 场景 / 时长 …">
    <span class="hits" id="hits"></span>
  </div>
</header>
<main class="main" id="main"></main>
<div class="toast" id="toast"></div>
<script>
const DATA = __DATA__;
function esc(s){return (s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700);}
function doCopy(txt,label){
  const t=(txt||'').trim();
  if(!t){toast('这条没有可复制内容');return;}
  const done=()=>toast('已复制 ['+label+'] '+t.length+' 字');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,
    ()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(txt,done){
  try{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();
  }catch(e){toast('复制失败：浏览器限制');}
}
function hl(text,q){
  const s=esc(text==null?'':String(text));
  if(!q) return s;
  const eq=esc(q),lq=eq.toLowerCase();
  if(!lq) return s;
  let out='',rest=s,low=s.toLowerCase(),i=low.indexOf(lq);
  while(i!==-1){
    out+=rest.slice(0,i)+'<mark>'+rest.slice(i,i+eq.length)+'</mark>';
    rest=rest.slice(i+eq.length); low=rest.toLowerCase(); i=low.indexOf(lq);
  }
  return out+rest;
}
function copyable(it){
  const parts=[];
  (it.kv||[]).forEach(b=>parts.push('【'+b.k+'】'+(b.v||'')));
  return parts.join('\n');
}
function render(it,i,q){
  let kv='';
  (it.kv||[]).forEach((b,bj)=>{
    const v=b.v||'';
    const isLine=(b.k.indexOf('台词')!==-1);
    let extra='';
    if(isLine && v.indexOf('原文：')!==-1){
      const kr=v.replace(/^[\s\S]*?「([^」]+)[\s\S]*$/,'$1');
      const cn=v.replace(/^[\s\S]*?原文：([^）]+)[\s\S]*$/,'$1');
      extra='<div class="miniactions">'
        +`<button class="btn" onclick="doCopy(document.getElementById('kr${i}_${bj}').textContent,'韩文台词（出图用）')">复制韩文台词</button>`
        +`<button class="btn" onclick="doCopy(document.getElementById('cn${i}_${bj}').textContent,'中文原文')">复制中文原文</button>`
        +`<pre id="kr${i}_${bj}" style="display:none">${esc(kr)}</pre><pre id="cn${i}_${bj}" style="display:none">${esc(cn)}</pre>`
        +'</div>';
    }
    kv+=`<div class="frow"><div class="fk">[${esc(b.k)}]</div><div class="fv">${hl(v,q)}${extra}</div></div>`;
  });
  let rest='';
  if((it.rest||[]).length){
    let ul=false;
    (it.rest||[]).forEach(r=>{
      if(!ul){rest+='<ul style="margin:6px 0 6px 18px;padding:0">';ul=true;}
      rest+='<li>'+hl(r,q)+'</li>';
    });
    if(ul) rest+='</ul>';
    rest='<div class="rest">'+rest+'</div>';
  }
  const whole=copyable(it);
  const tt=(it.title||'').slice(0,20);
  return `<article class="card" id="c${i}"><header class="chead"><div><h2>${hl(it.title,q)}</h2></div>`
    +`<div class="tools"><button class="btn primary" onclick="doCopy(document.getElementById('w${i}').textContent,'${esc(tt)} — 整块提示词')">复制本块（整块提示词）</button></div>`
    +`</header><div class="cbody"><pre id="w${i}" style="display:none">${esc(whole)}</pre>${kv}${rest}</div></article>`;
}
function draw(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const main=document.getElementById('main');
  let html='',shown=0;
  DATA.items.forEach((it,i)=>{
    const blob=((it.title||'')+JSON.stringify(it)).toLowerCase();
    if(q && blob.indexOf(q)===-1) return;
    html+=render(it,i,q); shown++;
  });
  if(!shown) html='<div class="empty">没有匹配块。换个关键词或清空搜索。</div>';
  main.innerHTML=html;
  document.getElementById('hits').textContent='共 '+DATA.items.length+' 块'+(q?(' ｜ 命中 '+shown):'');
}
document.getElementById('q').addEventListener('input',draw);
draw();
</script>
</body>
</html>
